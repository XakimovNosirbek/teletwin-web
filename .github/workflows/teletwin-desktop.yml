# TeleTwin desktop packages: a Tauri shell that opens the hosted web app (BASE_URL),
# so web deploys update every desktop install. Unsigned, no updater.

name: TeleTwin desktop

on:
  workflow_dispatch:
  push:
    branches:
      - teletwin
    paths:
      - 'tauri/**'
      - '.github/workflows/teletwin-desktop.yml'

env:
  BASE_URL: https://dtwin.uz/teletwin/web/
  APP_TITLE: TeleTwin

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            platform: windows-latest
            args: '--bundles nsis'
          - name: macos-arm64
            platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles dmg'
          - name: macos-x64
            platform: macos-latest
            args: '--target x86_64-apple-darwin --bundles dmg'
          - name: linux
            platform: ubuntu-22.04
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Build packages
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: build
        with:
          args: ${{ matrix.args }} -c tauri/tauri.teletwin.conf.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TeleTwin-${{ matrix.name }}
          if-no-files-found: error
          path: |
            tauri/target/**/release/bundle/nsis/*.exe
            tauri/target/**/release/bundle/dmg/*.dmg
            tauri/target/**/release/bundle/deb/*.deb
            tauri/target/**/release/bundle/appimage/*.AppImage
