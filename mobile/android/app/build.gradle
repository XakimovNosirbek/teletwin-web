apply plugin: 'com.android.application'

android {
    namespace = "uz.dtwin.teletwin"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "uz.dtwin.teletwin"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes the run number / tag; local builds stay at 1 / 1.0.0
        versionCode((System.getenv("TELETWIN_VERSION_CODE") ?: "1") as Integer)
        versionName System.getenv("TELETWIN_VERSION_NAME") ?: "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing comes only from the environment (CI secrets); the keystore is never committed.
    def releaseKeystore = System.getenv("TELETWIN_KEYSTORE_FILE")
    // Tester key (CI secret TELETWIN_TESTER_KEYSTORE_*): one stable signature for debug and internal
    // APKs, so every CI build installs over the previous one. Without it Gradle's local debug key is used.
    def testerKeystore = System.getenv("TELETWIN_TESTER_KEYSTORE_FILE")
    signingConfigs {
        if (testerKeystore) {
            tester {
                storeFile file(testerKeystore)
                storePassword System.getenv("TELETWIN_TESTER_KEYSTORE_PASSWORD")
                keyAlias "tester"
                keyPassword System.getenv("TELETWIN_TESTER_KEYSTORE_PASSWORD")
            }
        }
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("TELETWIN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TELETWIN_KEY_ALIAS")
                keyPassword System.getenv("TELETWIN_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            if (testerKeystore) {
                signingConfig signingConfigs.tester
            }
        }
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Tester APK: release code (not debuggable, so ART runs the WebView's Java precompiled and
        // WebView inspection stays off) signed with the tester (or local debug) key, not the release key.
        internal {
            initWith release
            signingConfig testerKeystore ? signingConfigs.tester : signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
